        /*
         * TnJ Self-Adhesive Label Paper No. 108
         * ─────────────────────────────────────
         * Source: MS Word Label Template (Mailings > Labels > Options)
         *
         * Label size       : 38mm wide × 18mm tall
         * Grid             : 5 cols × 8 rows = 40 labels per sheet
         * Top margin       : 4mm
         * Side margin      : 4mm
         * Horizontal pitch : 41mm (38mm label + 3mm gap between columns)
         * Vertical pitch   : 20mm (18mm label + 2mm gap between rows)
         *
         * Verification:
         *   Width  = 4mm + (5 × 41mm) - 3mm + 4mm = 210mm  ✓  (A4 width)
         *   Height = 4mm + (8 × 20mm) - 2mm + minor = 162mm + bottom remainder
         *
         * Paper: A4 (210mm × 297mm)
         */

        @page {
            margin: 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0px;
            padding: 0px;
        }

        .page {
            padding-top: 4mm;   /* Top margin from template */
            padding-left: 4mm;  /* Side margin from template */
            page-break-after: always;
            position: relative;
        }

        .page-last {
            page-break-after: auto;
        }

        /* Table-based grid — DomPDF safe (no flexbox/grid) */
        .label-table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        .label-cell {
            width: 38mm;
            height: 18mm;
            padding: 0;
            vertical-align: top;
        }

        /* Horizontal pitch = 41mm → 38mm label + 3mm gap */
        .col-gap {
            width: 3mm;
        }

        /* Vertical pitch = 20mm → 18mm label + 2mm gap */
        .row-gap {
            height: 2mm;
        }

        /* Label sticker — fills the entire 38mm × 18mm cell */
        .label-box {
            width: 38mm;
            height: 18mm;
            border: 0.3mm dashed #cccccc;
            padding: 1mm 1.5mm;
            position: relative;
            overflow: hidden;
        }

        /* Empty slot — transparent placeholder for skipped labels */
        .label-empty {
            width: 38mm;
            height: 18mm;
            background: transparent;
        }

        .label-barcode {
            text-align: center;
            margin-bottom: 0.5mm;
        }

        .label-barcode img {
            max-width: 34mm;
            height: 5mm;
        }

        .label-nama {
            font-size: 5.5pt;
            font-weight: bold;
            color: #111111;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
        }

        .label-harga {
            font-size: 7.5pt;
            font-weight: bold;
            color: #111111;
            margin-top: 0.5mm;
            line-height: 1;
        }

        .label-timestamp {
            font-size: 4pt;
            color: #666666;
            margin-top: 0.3mm;
            line-height: 1.2;
        }

        .label-id {
            position: absolute;
            bottom: 0.5mm;
            right: 1mm;
            font-size: 4pt;
            color: #aaaaaa;
        }
    </style>
